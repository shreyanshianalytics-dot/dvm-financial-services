<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="DVM Financial Services - Loans, insurance, investment support and financial advisory services."
  />
  <title>DVM Financial Services</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f7f8fb;
      color: #1f2937;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0b1f3a;
      color: white;
      padding: 18px 8%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 0.3px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 24px;
      font-size: 15px;
      font-weight: 600;
    }

    nav a:hover {
      color: #d4af37;
    }

    .hero {
      min-height: 88vh;
      padding: 70px 8%;
      display: flex;
      align-items: center;
      background:
        linear-gradient(rgba(11,31,58,0.88), rgba(22,59,104,0.85)),
        url('https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=1600&q=80')
        center/cover no-repeat;
      color: white;
    }

    .hero-content {
      max-width: 760px;
    }

    .hero-small {
      display: inline-block;
      color: #d4af37;
      font-weight: 700;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-size: 14px;
    }

    .hero h1 {
      font-size: 54px;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #d4af37;
    }

    .hero p {
      font-size: 19px;
      color: #e5e7eb;
      max-width: 680px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: 700;
      margin-right: 10px;
      transition: 0.25s ease;
    }

    .btn-primary {
      background: #d4af37;
      color: #0b1f3a;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: #e2c45f;
    }

    .btn-secondary {
      border: 1px solid rgba(255,255,255,0.8);
      color: white;
    }

    .btn-secondary:hover {
      background: white;
      color: #0b1f3a;
    }

    section {
      padding: 75px 8%;
    }

    .section-title {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 45px;
    }

    .section-title h2 {
      font-size: 36px;
      color: #0b1f3a;
      margin-bottom: 12px;
    }

    .section-title p {
      color: #6b7280;
      font-size: 17px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 24px;
    }

    .service-card {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.07);
      transition: 0.25s ease;
      border-top: 4px solid #d4af37;
    }

    .service-card:hover {
      transform: translateY(-6px);
    }

    .service-card h3 {
      color: #0b1f3a;
      margin-bottom: 10px;
      font-size: 21px;
    }

    .service-card p {
      color: #6b7280;
    }

    .about {
      background: #eef2f7;
    }

    .about-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .about-text h2 {
      color: #0b1f3a;
      font-size: 36px;
      margin-bottom: 18px;
    }

    .about-text p {
      color: #4b5563;
      margin-bottom: 14px;
    }

    .about-points {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-top: 24px;
    }

    .point {
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    .point h4 {
      color: #0b1f3a;
      margin-bottom: 6px;
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 22px;
    }

    .step {
      text-align: center;
      background: white;
      padding: 28px 20px;
      border-radius: 12px;
      box-shadow: 0 7px 22px rgba(0,0,0,0.06);
    }

    .step-number {
      width: 52px;
      height: 52px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #0b1f3a;
      color: #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
    }

    .contact {
      background: #0b1f3a;
      color: white;
    }

    .contact-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
    }

    .contact-info h2 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .contact-info p {
      color: #d1d5db;
      margin-bottom: 12px;
    }

    .contact-form {
      background: white;
      padding: 28px;
      border-radius: 14px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 14px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      outline: none;
    }

    .contact-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    .contact-form button {
      width: 100%;
      border: none;
      cursor: pointer;
      padding: 14px;
      background: #d4af37;
      color: #0b1f3a;
      font-weight: 700;
      border-radius: 7px;
    }

    footer {
      background: #071426;
      color: #cbd5e1;
      text-align: center;
      padding: 22px 15px;
      font-size: 14px;
    }

    .whatsapp {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 50px;
      font-weight: 700;
      box-shadow: 0 7px 22px rgba(0,0,0,0.25);
      z-index: 1000;
    }

    @media (max-width: 850px) {
      header {
        flex-direction: column;
        gap: 12px;
      }

      nav a {
        margin: 0 8px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .about-wrap,
      .contact-wrap {
        grid-template-columns: 1fr;
      }

      .about-points {
        grid-template-columns: 1fr;
      }
    }
  .brand img {   height: 45px;   width: auto;   display: block;   object-fit: contain; }
</head>

<body>

<div class="brand">

    <nav>

      <div>
